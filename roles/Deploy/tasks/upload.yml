---
- name: Create the remote app root with restricted ownership
  ansible.builtin.file:
    path: "{{ remote_root_path }}"
    state: directory
    mode: '0755'
    owner: "{{ remote_root_owner }}"
    group: "{{ remote_root_group }}"

- name: Prepare safe rsync delete protection
  ansible.builtin.include_tasks: rsync-options.yml

- name: Rsync application files to the remote server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../.."
    dest: "{{ remote_root_path }}"
    recursive: true
    delete: true
    rsync_opts: "{{ deploy_rsync_opts }}"

- name: Ensure Laravel writable directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ remote_root_owner }}"
    group: "{{ remote_root_group }}"
  loop:
    - "{{ remote_storage_path }}/app/public"
    - "{{ remote_storage_path }}/framework/cache/data"
    - "{{ remote_storage_path }}/framework/sessions"
    - "{{ remote_storage_path }}/framework/views"
    - "{{ remote_storage_path }}/logs"
    - "{{ remote_root_path }}/bootstrap/cache"

- name: Set up additional directory permissions for www-data user on storage folder
  ansible.posix.acl:
    path: "{{ remote_storage_path }}"
    entry: group:www-data:rwX
    recursive: yes
    state: present

- name: Set up additional directory permissions for www-data user on bootstrap/cache folder
  ansible.posix.acl:
    path: "{{ remote_root_path }}/bootstrap/cache/"
    entry: group:www-data:rwX
    recursive: yes
    state: present
