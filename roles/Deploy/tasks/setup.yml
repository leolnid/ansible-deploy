---
- name: Preserve an existing environment unless explicitly opted in to update it
  ansible.builtin.include_tasks: environment.yml

- name: Remove only generated Laravel manifests from the previous dependency set
  ansible.builtin.file:
    path: "{{ remote_root_path }}/bootstrap/cache/{{ item }}"
    state: absent
  loop:
    - config.php
    - services.php
    - packages.php
    - events.php

- name: Install Dependencies with Composer
  become: true
  become_user: '{{ remote_root_owner }}'
  ansible.builtin.command:
    argv: >-
      {{ [php_cli_binary, composer_path, 'install', '--no-scripts'] +
         ((deploy_composer_no_dev | default(true) | bool) | ternary(['--no-dev'], [])) }}
  args:
    chdir: "{{ remote_root_path }}"
  tags: [ 'composer' ]
  register: composer_install_result

- name: Run package:discover manually after composer install
  become: true
  become_user: '{{ remote_root_owner }}'
  ansible.builtin.command: "{{ php_cli_binary }} {{ remote_root_path }}/artisan package:discover"
  args:
    chdir: "{{ remote_root_path }}"
  when: composer_install_result is succeeded
  tags: [ 'composer' ]

- name: Setup cron
  ansible.builtin.cron:
    name: 'Запустить планировщик для проекта {{ domain }}'
    user: '{{ remote_root_owner }}'
    job: 'cd {{ remote_root_path }} && {{ php_cli_binary }} artisan schedule:run >> {{ remote_storage_path }}/logs/cron.log'
  tags: [ 'cron' ]

- name: Setup supervisor
  block:
    - name: Check config file
      become: true
      ansible.builtin.template:
        src: supervisor-queue.conf.j2
        dest: "/etc/supervisor/conf.d/{{ domain }}-queue.conf"

    - name: Reload supervisor config
      command: supervisorctl reread

    - name: Apply supervisor process changes
      ansible.builtin.command: "supervisorctl update {{ domain | replace('.', '-') }}-queue"

    - name: Restart supervisor
      ansible.builtin.command: "supervisorctl restart {{ domain | replace('.', '-') }}-queue:"

  tags: [ 'supervisor' ]
