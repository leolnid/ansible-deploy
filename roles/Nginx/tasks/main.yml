---
- name: Install Nginx without upgrading a shared service unexpectedly
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure only this application's Nginx virtual host
  ansible.builtin.include_tasks: configure-vhost.yml
  vars:
    nginx_site_path: "/etc/nginx/sites-available/{{ domain }}.conf"
    nginx_site_template: nginx.conf.j2

- name: Enable application virtual host
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ domain }}.conf"
    state: link
  notify: Apply Nginx config safely

# UFW Configuration
- name: "UFW - Allow HTTP on port 443"
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: "UFW - Allow HTTP on port 80"
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
