---
- name: Update apt cache with releaseinfo change allowed
  command: apt-get update --allow-releaseinfo-change
  changed_when: false
  ignore_errors: yes

- name: Install Nginx
  apt:
    name: nginx
    update_cache: no
    state: latest

# Nginx Configuration
- name: Sets Nginx conf file
  template:
    src: "nginx.conf.j2"
    dest: "/etc/nginx/sites-available/{{ domain }}.conf"
    force: true

- name: Enables new site
  file:
    src: "/etc/nginx/sites-available/{{ domain }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ domain }}.conf"
    state: link
  notify: Restart Nginx

# UFW Configuration
- name: "UFW - Allow HTTP on port 443"
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: "UFW - Allow HTTP on port 80"
  ufw:
    rule: allow
    port: '80'
    proto: tcp
